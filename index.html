<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>자기소개 카드</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<style>
  :root{
    --bg-mint: #a9dcce;
    --bg-mint-soft: #c3e9de;
    --box-white: #ffffff;
    --text-main: #2c3532;
    --text-sub: #7c8b87;
    --text-teal: #3f7f79;
    --text-red: #ad5c56;
    --pill-bg: #eef8f4;
    --pill-border: #cdece2;
    --divider: #e3efeb;
    --card-radius: 36px;
    --inner-radius: 20px;
    --shadow: 0 20px 45px rgba(35, 80, 70, 0.18);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    min-height:100vh;
    font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    color: var(--text-main);
  }

  body{
    background: linear-gradient(160deg, var(--bg-mint) 0%, var(--bg-mint-soft) 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 48px 20px;
  }

  .card{
    width:100%;
    max-width: 920px;
    background: var(--box-white);
    border-radius: var(--card-radius);
    box-shadow: var(--shadow);
    padding: 56px;
    display:flex;
    gap: 48px;
  }

  /* ---------- Left column ---------- */
  .profile-col{
    flex: 0 0 300px;
    display:flex;
    flex-direction:column;
    gap: 26px;
  }

  .avatar-row{
    display:flex;
    align-items:center;
    gap:16px;
  }

  .avatar{
    width:76px;
    height:76px;
    border-radius:50%;
    flex-shrink:0;
    object-fit: cover;
    border: 3px solid var(--box-white);
    box-shadow: 0 0 0 3px var(--pill-border);
  }

  .name-block .nickname{
    font-size: 19px;
    font-weight: 700;
    color: var(--text-main);
    line-height:1.3;
  }

  .name-block .handle{
    font-size: 13.5px;
    color: var(--text-sub);
    margin-top:2px;
  }

  .tag-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }

  .tag{
    font-size: 12.5px;
    font-weight:600;
    color: var(--text-teal);
    background: var(--pill-bg);
    border: 1px solid var(--pill-border);
    border-radius: 999px;
    padding: 6px 14px;
    white-space:nowrap;
  }

  .section-label{
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-sub);
    letter-spacing: 0.02em;
  }

  .intro-text{
    font-size: 14.5px;
    line-height: 1.75;
    color: var(--text-teal);
    white-space: pre-line;
  }

  .intro-block{
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .link-list{
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-top: 4px;
  }

  .link-list a{
    font-size: 13px;
    font-weight:600;
    color: var(--text-teal);
    text-decoration:none;
    display:flex;
    align-items:baseline;
    gap:6px;
  }

  .link-list a .link-label{
    color: var(--text-sub);
    font-weight:500;
    font-size:12px;
  }

  .link-list a:hover{ text-decoration: underline; }

  /* ---------- Divider ---------- */
  .divider{
    width:1px;
    background: var(--divider);
    flex-shrink:0;
  }

  /* ---------- Right column ---------- */
  .works-col{
    flex:1;
    display:flex;
    flex-direction:column;
    gap: 22px;
    min-width:0;
  }

  .works-header{
    display:flex;
    align-items:center;
    gap:8px;
    color: #d98fa9;
  }

  .works-header svg{ width:20px; height:20px; }

  .works-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .work-card{
    position:relative;
    aspect-ratio: 4 / 3;
    border-radius: var(--inner-radius);
    overflow:hidden;
    border:none;
    padding:0;
    cursor:pointer;
    text-align:left;
    background:
      linear-gradient(to top, rgba(10,14,14,0.86) 0%, rgba(10,14,14,0.15) 60%, rgba(10,14,14,0) 100%),
      linear-gradient(135deg, #cfe8e0, #9fd0c3 55%, #7cb9ae 100%);
    transition: transform 0.15s ease;
  }

  .work-card:hover{ transform: translateY(-2px); }
  .work-card:focus-visible{ outline: 3px solid var(--text-teal); outline-offset:2px; }

  .work-card .work-text{
    position:absolute;
    left:14px;
    right:14px;
    bottom:12px;
    display:flex;
    flex-direction:column;
    gap:2px;
  }

  .work-card .work-title{
    font-size: 11.5px;
    font-weight:600;
    color:#ffffff;
    opacity:0.5;
  }

  .work-card .character-name{
    font-size: 16px;
    font-weight:700;
    color:#ffffff;
  }

  .ng-highlight{
    color: var(--text-red);
    font-weight:700;
  }

  .list-row{
    display:flex;
    gap:8px;
    font-size: 14px;
    line-height:1.6;
  }

  .list-row .label{
    flex-shrink:0;
    font-weight:700;
  }

  .list-row.ng .label, .list-row.ng .value{ color: var(--text-red); }
  .list-row.dream .label, .list-row.dream .value{ color: var(--text-teal); }

  .bottom-row{
    display:flex;
    justify-content:flex-end;
    margin-top: 4px;
  }

  .consider-btn{
    font-family: inherit;
    font-size: 13.5px;
    font-weight:700;
    color: var(--box-white);
    background: linear-gradient(135deg, #5aa89e, #3f7f79);
    border:none;
    border-radius: 999px;
    padding: 11px 22px;
    cursor:pointer;
  }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed;
    inset:0;
    background: rgba(30, 45, 42, 0.45);
    display:none;
    align-items:center;
    justify-content:center;
    padding: 24px;
    z-index: 100;
  }

  .modal-overlay.open{ display:flex; }

  .modal-box{
    width:100%;
    max-width: 380px;
    background: var(--box-white);
    border-radius: 24px;
    padding: 30px 28px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.25);
    position:relative;
  }

  .modal-close{
    position:absolute;
    top:16px;
    right:16px;
    width:28px;
    height:28px;
    border:none;
    background: var(--pill-bg);
    border-radius:50%;
    color: var(--text-sub);
    font-size:16px;
    cursor:pointer;
    line-height:1;
  }

  .modal-title{
    font-size: 17px;
    font-weight:700;
    margin: 0 0 4px 0;
  }

  .modal-subtitle{
    font-size: 13px;
    color: var(--text-sub);
    margin: 0 0 16px 0;
  }

  .modal-body{

    }
  };

  const overlay = document.getElementById('modalOverlay');
  const modalTitle = document.getElementById('modalTitle');
  const modalSubtitle = document.getElementById('modalSubtitle');
  const modalBody = document.getElementById('modalBody');

  function openWork(id){
    const w = works[id];
    modalTitle.textContent = w.modalTitle;
    modalSubtitle.textContent = w.modalSubtitle;
    modalBody.innerHTML = w.bodyHTML;
    overlay.classList.add('open');
  }

  function openConsider(){
    modalTitle.textContent = "배려리스트";
    modalSubtitle.textContent = "";
    // Replace this text with your actual 배려리스트 content,
    // or swap modalBody for an <iframe src="..."> pointing at your list site.
    modalBody.textContent = "이곳에 배려리스트 내용을 입력하거나,\n배려리스트 사이트 링크를 연결해 주세요.";
    overlay.classList.add('open');
  }

  function closeModal(){
    overlay.classList.remove('open');
  }

  function closeModalOnBackdrop(e){
    if (e.target === overlay) closeModal();
  }

  document.addEventListener('keydown', (e)=>{
    if (e.key === 'Escape') closeModal();
  });
